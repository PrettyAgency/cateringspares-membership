<script>
const pages=[
 ['landing','01 · Membership Landing','Public'],['plans','02 · Pricing & Plan Comparison','Public'],['plan-detail','03 · Trade Care Plan Details','Public'],['eligibility','04 · Eligibility & Sign In','Public'],['checkout','05 · Subscription Checkout','Public'],['success','06 · Signup Confirmation','Public'],
 ['account','07 · My Account Dashboard','Customer'],['subscriptions','08 · My Subscriptions','Customer'],['subscription-detail','09 · Subscription Details','Customer'],['benefits','10 · My Membership Benefits','Customer'],['equipment','11 · Saved Equipment (Phase 2)','Customer'],['request','12 · Priority Parts Request','Customer'],['offers','13 · Member Offers','Customer'],['billing','14 · Billing & Payment Details','Customer'],['change-plan','15 · Change Plan (Phase 2)','Customer'],['cancel','16 · Cancel Membership','Customer'],
 ['admin-overview','17 · Magento Admin Overview','Admin'],['admin-members','18 · Members & Subscriptions','Admin'],['admin-plans','19 · Plans & Benefit Rules','Admin'],['admin-requests','20 · Member Support Requests','Admin'],['admin-health','21 · Payment & Webhook Health','Admin'],['admin-audit','22 · Audit & Release Log','Admin']
];
const demo=(text='Concept interaction only. No live account, payment, subscription or Magento records are changed.')=>alert(text);
function link(id,label,cls='button'){return `<a href="#${id}" class="${cls}">${label}</a>`}
function tag(text,type='blue'){return `<span class="tag ${type}">${text}</span>`}
function bullets(arr){return `<ul class="checks">${arr.map(x=>`<li><span class="check">✓</span><span>${x}</span></li>`).join('')}</ul>`}
function section(title,subtitle='',right=''){return `<div class="heading-row"><div><h1>${title}</h1><p>${subtitle}</p></div>${right}</div>`}
function panel(body,cls=''){return `<div class="panel ${cls}">${body}</div>`}
function btn(text,on='demo()',cls='button'){return `<button class="${cls}" onclick="${on}">${text}</button>`}
const memberSide=[['account','My Account'],['subscriptions','My Subscriptions'],['benefits','My Membership'],['equipment','My Equipment'],['request','Parts Assistance'],['offers','Member Offers'],['billing','Billing & Invoices'],['cancel','Cancel Membership']];
const adminSide=[['admin-overview','Membership Overview'],['admin-members','Members & Subscriptions'],['admin-plans','Plans & Benefits'],['admin-requests','Priority Requests'],['admin-health','Payments & Renewal Health'],['admin-audit','Audit & Releases']];
function userLayout(active,html){return `<div class="account-layout"><aside class="side"><h3>MY ACCOUNT</h3><div class="side-links"><a href="#account">My Account</a><a>My Orders</a><a>My Downloadable Products</a><a>My Wish List</a><a>Address Book</a><a>Account Information</a><a>Stored Payment Methods</a><a>Newsletter Subscriptions</a>${memberSide.slice(1).map(([id,label])=>`<a href="#${id}" class="${id===active?'active':''}">${label}</a>`).join('')}<a href="#landing">Logout</a></div><div class="wish">MY WISH LIST</div><p class="wishnote">Your saved parts will appear here.</p></aside><main>${html}</main></div>`}
function adminLayout(active,html){return `<div class="admin-layout"><aside class="admin-side"><h4>MAGENTO COMMERCE</h4>${adminSide.map(([id,label])=>`<a href="#${id}" class="${id===active?'active':''}">${label}</a>`).join('')}<div class="spacer"></div><h4>DEMO ONLY</h4><a href="#account">↩ Customer view</a></aside><main class="admin-main">${html}</main></div>`}
function cardPrice(name,price,desc,items,featured=false,coming=false){return `<div class="pricecard ${featured?'featured':''}" style="position:relative">${featured?'<span class="ribbon">RECOMMENDED PILOT</span>':''}<div class="section-eyebrow">${coming?'LATER PHASE':'MONTHLY PLAN'}</div><h3>${name}</h3><div class="price">${price===0?'Free':`$${price}<small> / month</small>`}</div><p class="fine" style="min-height:47px">${desc}</p>${bullets(items)}${coming?link('change-plan','Explore Later-Phase Concept','button ghost wide'):link(name==='Trade Care'?'plan-detail':'eligibility',price===0?'Continue With Free Account':'View Membership','button wide')}</div>`}
function landing(){return `<div class="content"><div class="hero"><div><div class="section-eyebrow">CATERINGSPARES TRADE MEMBERSHIP</div><h1>Keep your kitchen equipment running. <span style="color:#1d3040">Get more from every order.</span></h1><p class="subline">A practical membership for approved service businesses, combining eligible member offers, parts assistance and convenient account tools in one place.</p>${bullets(['Member-only offers on selected spare parts','Two priority parts-identification requests per month','Your membership and billing managed in My Account'])}<div class="row">${link('plans','Explore Membership Plans')}${link('eligibility','Check Eligibility','button ghost')}</div><p class="fine">Proposed pilot offer. Prices and benefits subject to approval.</p></div><div class="hero-illus"><div class="big-gear">⚙</div><div class="machine"></div><div class="part">PARTS • SERVICE • SUPPORT</div></div></div><div class="spacer"></div><div class="spread divider-title"><h2>Simple membership, useful benefits</h2>${tag('One paid plan at launch','green')}</div><div class="benefit-grid">${[['◉','Member offers','Selected products and controlled discounts.'],['▣','Priority parts help','Two requests per billing month.'],['☰','Fast reorder tools','Quick access to previously purchased parts.'],['▤','Manage online','Plan status and billing in your existing account.']].map(a=>`<div class="benefit-tile"><div class="icon-round">${a[0]}</div><h4>${a[1]}</h4><p class="fine">${a[2]}</p></div>`).join('')}</div><div class="spacer"></div><div class="notice">The existing Magento customer login, checkout, and Adobe Payment Services “My Subscriptions” page stay in place. This is a proposed interface enhancement.</div></div>`}

function adminAudit(){return adminLayout('admin-audit',`${section('Audit & Release Log','Trace sensitive membership changes and record packaged extension releases.',tag('Immutable audit trail','blue'))}<div class="g2">${panel(`<h3>Membership change history</h3><div class="timeline">${[['Plan benefits updated','Admin role approved a draft rules change'],['Membership status reconciled','Provider event verified, entitlement recalculated'],['Assistance allowance used','Customer request completed and usage recorded']].map(x=>`<div class="dot"></div><div class="event"><strong>${x[0]}</strong><p class="fine">${x[1]}</p></div>`).join('')}</div>`)}${panel(`<h3>Custom extension releases</h3><table class="table"><thead><tr><th>Release</th><th>Stage</th><th>Approval</th></tr></thead><tbody><tr><td>v1.0.0</td><td>Staging</td><td>${tag('UAT required','amber')}</td></tr><tr><td>v0.9.0</td><td>QA complete</td><td>${tag('Approved','green')}</td></tr></tbody></table><p class="fine">Mock history. Private Git, versioned package and rollback are proposed controls.</p>` )}</div><h3 class="divider-title">Release checklist</h3>${panel(`${bullets(['Magento and Adobe Payment Services compatibility review','Security and customer-authorisation tests','Staging checkout and renewal regression','Nexcess backup and rollback plan','Pilot approval and production monitoring'])}`)}</div>`) }
const views={'landing':landing,'plans':plans,'plan-detail':planDetail,'eligibility':eligibility,'checkout':checkout,'success':success,'account':account,'subscriptions':subscriptions,'subscription-detail':subscriptionDetail,'benefits':benefits,'equipment':equipment,'request':request,'offers':offers,'billing':billing,'change-plan':changePlan,'cancel':cancel,'admin-overview':adminOverview,'admin-members':adminMembers,'admin-plans':adminPlans,'admin-requests':adminRequests,'admin-health':adminHealth,'admin-audit':adminAudit};
function shell(id){const isAdmin=id.startsWith('admin-');const current=pages.find(p=>p[0]===id)||pages[0];const idx=pages.findIndex(p=>p[0]===id);document.title=`${current[1]} | CateringSpares Design Concept`;return `<div class="mini-top"><div><span>Home</span><span>My Account</span><span>My Wish List</span><span>Checkout</span><span>Register</span><span>News</span></div><div>Concept customer: Alex Taylor &nbsp; | &nbsp; Log Out ➝</div></div><header class="site-header"><a href="#landing" class="brand"><div class="brandmark">CS</div><div><div class="brandname">CATERING<em>SPARES</em></div><div class="brandtag">GENUINE & REPLACEMENT PARTS</div></div></a><div class="head-contact"><span style="color:var(--blue)">♧</span> 0401 511 115 <span>🛒 CART</span></div></header><nav class="nav"><div class="nav-list"><span>SHOP BY MANUFACTURER</span><span>SHOP BY CATEGORY ▼</span><span>CATERING EQUIPMENT</span><span><a href="#landing" style="color:#8ec9ef">MEMBERSHIP</a></span></div><div class="search"><input placeholder="Search parts, brands, models..."><button onclick="demo()">⌕</button></div></nav><div class="demo-bar"><span><strong>DESIGN CONCEPT</strong> &nbsp; ${String(idx+1).padStart(2,'0')} / ${pages.length} &nbsp; · &nbsp; ${current[1]} &nbsp; · &nbsp; Not a live website · Adobe-first billing concept, subject to provider verification</span><span>${current[2]==='Admin'?'Magento Admin UX':'Customer experience'} &nbsp; ${current[2]==='Admin'?tag('Admin','blue'):''}</span></div>${isAdmin?views[id]():views[id]()}<div class="foot-site"><div><strong>INFORMATION</strong><p>Home &nbsp; · &nbsp; Orders and Returns &nbsp; · &nbsp; Contact Us</p><p class="fine">CateringSpares membership concept design</p></div><div><strong>MY ACCOUNT</strong><p>${link('account','My Account')} &nbsp; · &nbsp; ${link('subscriptions','My Subscriptions')}</p></div><div><strong>MEMBERSHIP SUPPORT</strong><p>See plan information, renewal details and support options.</p><span class="footer-tag">Design by Pretty · Concept</span></div></div><div class="nav-helper"><button aria-label="Previous design" onclick="move(-1)">←</button><select aria-label="Choose page design" id="page-switch" onchange="location.hash=this.value">${pages.map(p=>`<option value="${p[0]}" ${p[0]===id?'selected':''}>${p[1]}</option>`).join('')}</select><button aria-label="Next design" onclick="move(1)">→</button></div>`}
function move(n){const id=location.hash.slice(1)||'landing';const index=pages.findIndex(p=>p[0]===id);location.hash=pages[Math.max(0,Math.min(pages.length-1,index+n))][0]}
function render(){const id=location.hash.replace('#','')||'landing';document.getElementById('app').innerHTML=shell(views[id]?id:'landing');window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
</script></body></html>
